<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ichina">
  <rect width="64" height="64" rx="14" fill="#0B2422"/>
  <defs>
    <linearGradient id="ichina-gold" x1="33" y1="13" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8C97A"/>
      <stop offset="0.42" stop-color="#D4AF6A"/>
      <stop offset="1" stop-color="#B8924A"/>
